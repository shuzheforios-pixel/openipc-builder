# General
model=OpenIPC ShowMe
manufacturer=OpenIPC
firmware_ver=OpenIPC 2.6.09.07
hardware_id=ssc33x
serial_num=90f7b2f5e98a
ifs=wlan0
port=85
scope=onvif://www.onvif.org/Profile/Streaming
#user=admin
#password=123456

#Profile 0
name=Profile_0
width=1920
height=1080
url=rtsp://%s/stream=0
snapurl=http://%s/image.jpg
type=H264

#Profile 1
name=Profile_1
width=640
height=360
url=rtsp://%s/stream=0
snapurl=http://%s/image.jpg?width=640&height=360
type=H264

#PTZ
ptz=1
move_left=/usr/bin/gpio-motors -1 0 10 >> /tmp/ptz.log 2>&1
move_right=/usr/bin/gpio-motors 1 0 10 >> /tmp/ptz.log 2>&1
move_up=/usr/bin/gpio-motors 0 1 10 >> /tmp/ptz.log 2>&1
move_down=/usr/bin/gpio-motors 0 -1 10 >> /tmp/ptz.log 2>&1
move_stop=/usr/bin/gpio-motors 0 0 0 >> /tmp/ptz.log 2>&1
