name: Build OpenIPC Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl \
            libncurses-dev libssl-dev python3 python3-pip \
            unzip rsync bc cpio file libtool automake

      - name: Build firmware
        run: |
          chmod +x builder.sh
          ./builder.sh t31_lite_zte-k545

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: archive/
